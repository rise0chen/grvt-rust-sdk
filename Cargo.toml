[package]
description = "Rust SDK for Gravity Markets (GRVT) REST, WebSocket, and EIP-712 signing APIs"
edition = "2021"
license = "MIT"
name = "grvt-rust-sdk"
publish = false
version = "0.1.0"

[features]
default = ["rustls-tls"]
native-tls = ["tokio-tungstenite/native-tls"]
rustls-tls = ["tokio-tungstenite/rustls-tls-native-roots"]

[dependencies]
alloy-primitives = {version = "1", default-features = false}
alloy-sol-types = {version = "1", default-features = false}
chrono = {version = "0.4", default-features = false, features = ["now"]}
futures = {version = "0.3", default-features = false}
hex = {version = "0.4", default-features = false, features = ["std"]}
rand = {version = "0.9", default-features = false}
reqwest = {version = "0.13", default-features = false, features = ["json"]}
secp256k1 = {version = "0.31", default-features = false, features = ["alloc", "rand", "recovery"]}
serde = {version = "1.0", default-features = false, features = ["derive"]}
serde_json = {version = "1", default-features = false}
serde_with = {version = "3", default-features = false, features = ["alloc", "macros"]}
thiserror = {version = "2", default-features = false}
time = {version = "0.3", default-features = false, features = ["std"]}
tokio = {version = "1", default-features = false, features = ["sync", "macros"]}
tokio-tungstenite = {version = "0.28", default-features = false, features = ["connect"]}
tracing = {version = "0.1", default-features = false}
url = {version = "2", default-features = false}

[dev-dependencies]
dotenvy = {version = "0.15", default-features = false}
tokio = {version = "1", features = ["full"]}
