[package]
name = "grvt-rust-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Gravity Markets (GRVT) REST, WebSocket, and EIP-712 signing APIs"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3" }
hex = "0.4"
rand = "0.9"
chrono = "0.4"
url = "2.5"
tracing = "0.1"
thiserror = "1"
secp256k1 = { version = "0.30", features = ["rand", "recovery"] }
alloy-primitives = "1"
alloy-sol-types = "1"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
